lexicon_version: 10

# Supply chain and operations vocabulary. A technology marked `needs_context`
# only counts when the document also uses one of these words somewhere — that is
# what separates "humanoid robots picking totes in a warehouse" from "humanoid
# robots learn dexterous manipulation".
#
# Deliberately absent: a bare "manufacturing". It is as much a technology word as
# a domain word, so it would let `additive_spares` satisfy its own gate.
context:
  - "supply chain(s)?"
  - "logistics"
  - "freight"
  - "(?<!data )warehouse(s|ing)?"
  - "distribution cent(er|re)(s)?"
  - "fulfil(l)?ment"
  - "procurement"
  - "sourcing"
  - "inventor(y|ies)"
  - "shipping"
  - "shipment(s)?"
  - "cargo"
  - "intermodal"
  - "truck(s|ing)?"
  - "\\b3PL\\b"
  - "last[- ]mile"
  - "supplier(s)?"
  - "shop floor"
  - "production line(s)?"
  - "factor(y|ies)"
  - "operations management"

technologies:
  # --- Automation & robotics -------------------------------------------------
  - {id: warehouse_robotics, name: Warehouse robotics, family: automation,
     include: ["warehouse robot(s|ics)?", "autonomous mobile robot(s)?", "\\bAMRs?\\b",
               "automated storage and retrieval", "\\bAS/RS\\b"],
     exclude: [], needs_context: true, status: active, added_week: 2026-W33, patterns_changed_week: 2026-W33}
  - {id: piece_picking, name: Piece-picking robotics, family: automation,
     include: ["piece[- ]picking", "robotic (item |piece )?picking", "bin picking"],
     exclude: [], needs_context: true, status: active, added_week: 2026-W33, patterns_changed_week: 2026-W33}
  # Broadened past the humanoid form factor, but only as far as the evidence
  # allows. "mobile manipulation" was measured and rejected: 14 gated hits, of
  # which one was about this domain -- the rest were generic embodied-AI papers
  # and an operating-room robot that passed the gate on the word "logistics".
  - {id: humanoid_logistics, name: General-purpose and humanoid robots in logistics, family: automation,
     include: ["humanoid robot(s)?", "general[- ]purpose humanoid", "general[- ]purpose robot(s)?"],
     exclude: [], needs_context: true, status: active, added_week: 2026-W33, patterns_changed_week: 2026-W34}
  - {id: autonomous_yard, name: Autonomous yard trucks, family: automation,
     include: ["autonomous yard (truck|tractor|spotter)(s)?", "yard automation"],
     exclude: [], status: active, added_week: 2026-W33, patterns_changed_week: 2026-W33}
  - {id: port_automation, name: Port and terminal automation, family: automation,
     include: ["automated (container )?terminal(s)?", "port automation",
               "automated stacking crane(s)?", "\\bAGVs? at (the )?port"],
     exclude: [], status: active, added_week: 2026-W33, patterns_changed_week: 2026-W33}
  - {id: sidewalk_delivery_robots, name: Last-mile delivery robots, family: automation,
     include: ["sidewalk (delivery )?robot(s)?", "last[- ]mile robot(s)?",
               "delivery robot(s)?"],
     exclude: [], status: active, added_week: 2026-W33, patterns_changed_week: 2026-W33}
  - {id: delivery_drones, name: Delivery drones, family: automation,
     include: ["delivery drone(s)?", "drone delivery", "\\bBVLOS\\b"],
     exclude: [], status: active, added_week: 2026-W33, patterns_changed_week: 2026-W33}
  - {id: robotic_manufacturing, name: Robotic manufacturing cells, family: automation,
     include: ["robotic (manufacturing|assembly|welding)", "industrial robot(s)?",
               "cobot(s)?", "collaborative robot(s)?"],
     exclude: [], needs_context: true, status: active, added_week: 2026-W33, patterns_changed_week: 2026-W33}

  # --- Vehicles & energy -----------------------------------------------------
  - {id: autonomous_trucking, name: Autonomous trucking, family: vehicles,
     include: ["autonomous truck(s|ing)?", "driverless truck(s|ing)?",
               "self[- ]driving (truck|freight)"],
     exclude: ["autonomous trucking (bill|act)"],
     status: active, added_week: 2026-W33, patterns_changed_week: 2026-W33}
  - {id: electric_trucks, name: Electric heavy-duty trucks, family: vehicles,
     include: ["electric (semi|truck|tractor)(s)?", "battery[- ]electric truck(s)?",
               "zero[- ]emission truck(s)?"],
     exclude: [], status: active, added_week: 2026-W33, patterns_changed_week: 2026-W33}
  - {id: hydrogen_trucks, name: Hydrogen fuel cell trucks, family: vehicles,
     include: ["hydrogen (fuel cell )?truck(s)?", "fuel cell electric truck(s)?"],
     exclude: [], status: active, added_week: 2026-W33, patterns_changed_week: 2026-W33}
  - {id: freight_charging, name: Freight EV charging infrastructure, family: vehicles,
     include: ["truck charging (corridor|depot|hub)(s)?", "megawatt charging",
               "depot charging"],
     exclude: [], status: active, added_week: 2026-W33, patterns_changed_week: 2026-W33}
  - {id: port_electrification, name: Port electrification and shore power, family: vehicles,
     include: ["shore power", "cold ironing", "port electrification"],
     exclude: [], status: active, added_week: 2026-W33, patterns_changed_week: 2026-W33}

  # --- Enterprise systems ----------------------------------------------------
  - {id: erp, name: ERP platforms, family: enterprise,
     include: ["enterprise resource planning", "\\bERP\\b", "S/4HANA", "SAP S/4"],
     exclude: [], needs_context: true, status: active, added_week: 2026-W33, patterns_changed_week: 2026-W33}
  # `\\bWMS\\b` is case-insensitive, so it also matches "WMs" -- the plural of
  # "World Model". That produced ten false arXiv matches, every one an embodied-AI
  # robotics paper. The gate fixes it at no cost: the full phrase contains
  # "warehouse", a context word, so it satisfies the gate on its own.
  - {id: wms, name: Warehouse management systems, family: enterprise,
     include: ["warehouse management system(s)?", "\\bWMS\\b"],
     exclude: [], needs_context: true,
     status: active, added_week: 2026-W33, patterns_changed_week: 2026-W34}
  - {id: mes, name: Manufacturing execution systems, family: enterprise,
     include: ["manufacturing execution system(s)?", "\\bMES\\b"],
     exclude: [], needs_context: true, status: active, added_week: 2026-W33, patterns_changed_week: 2026-W33}
  - {id: sop_planning, name: Sales and operations planning, family: enterprise,
     include: ["sales and operations planning", "\\bS&OP\\b",
               "integrated business planning"],
     exclude: [], status: active, added_week: 2026-W33, patterns_changed_week: 2026-W33}
  # `\\bAPS\\b` is case-insensitive, so it also matches "APs" -- the plural of
  # "access point". The Wi-Fi paper it caught passed the context gate on the word
  # "last-mile", which in that paper means the last radio hop. The gate cannot see
  # sense, so the exclusion has to name the other meaning.
  - {id: advanced_planning, name: Advanced planning and scheduling, family: enterprise,
     include: ["advanced planning (and scheduling|system(s)?)", "\\bAPS\\b",
               "production scheduling software"],
     exclude: ["access point(s)?"], needs_context: true,
     status: active, added_week: 2026-W33, patterns_changed_week: 2026-W34}

  # --- Digital planning & AI -------------------------------------------------
  # Bare "agentic ai" matched any paper about agents at all -- a cyber kill
  # chain, an NSF cyber-defence education grant, and two Hacker News threads
  # where the context gate opened on "shipping", as in "every startup shipping
  # a dashboard". 1 of 5 correct in the 2026-09-02 audit. "agentic procurement"
  # and "agentic sourcing" name the technology on their own and are kept; the
  # bare form now needs a procurement word within eighty characters, which is
  # the same shape quantum_logistics already uses. Eighty and not forty: the
  # re-audit of 2026-09-03 found forty dropped "Agentic AI for Cold-Chain
  # Sustainability: LSTM-Based Predictive Logistics", where the two sit
  # fifty-four characters apart.
  - {id: agentic_procurement, name: Agentic AI for procurement, family: digital,
     include: ["agentic (procurement|sourcing)",
               "agentic ai[^.]{0,80}(procurement|sourcing|supply chain|logistics|inventory|warehous)",
               "(procurement|sourcing|supply chain|logistics|inventory|warehous)[^.]{0,80}agentic ai",
               "\\bai agent(s)? (for|in) (procurement|sourcing|supply chain)"],
     exclude: ["software supply chain"], needs_context: true, status: active, added_week: 2026-W33, patterns_changed_week: 2026-W36}
  - {id: supply_chain_digital_twin, name: Supply chain digital twins, family: digital,
     include: ["digital twin(s)?"],
     exclude: [], needs_context: true, status: active, added_week: 2026-W33, patterns_changed_week: 2026-W35}
  - {id: demand_forecasting_ml, name: ML demand forecasting, family: digital,
     include: ["demand forecasting", "demand sensing"],
     exclude: [], needs_context: true, status: active, added_week: 2026-W33, patterns_changed_week: 2026-W33}
  - {id: control_tower, name: Supply chain control towers, family: digital,
     include: ["control tower(s)?"],
     exclude: [], needs_context: true, status: active, added_week: 2026-W33, patterns_changed_week: 2026-W35}
  - {id: genai_planning, name: Generative AI for supply chain planning, family: digital,
     include: ["(generative ai|genai|llm(s)?) (in|for|across) (supply chain|procurement|logistics|warehous(e|ing)|inventory|manufacturing)",
               "(supply chain|procurement|logistics) (generative ai|genai|llm(s)?)"],
     exclude: [], status: active, added_week: 2026-W33, patterns_changed_week: 2026-W35}
  - {id: tms_ai, name: AI transportation management, family: digital,
     include: ["transportation management system(s)?", "\\bTMS\\b",
               "\\bai\\b[^.]{0,30}route optimi[sz]ation"],
     exclude: ["transcranial magnetic stimulation", "ROS2-TMS"],
     needs_context: true, status: active, added_week: 2026-W33, patterns_changed_week: 2026-W34}
  - {id: digital_freight, name: Digital freight matching, family: digital,
     include: ["digital (freight )?(matching|brokerage)", "freight marketplace(s)?",
               "digital broker(age)?"],
     exclude: [], needs_context: true, status: active, added_week: 2026-W33, patterns_changed_week: 2026-W35}
  # Ungated: "vehicle routing problem" and "multi-agent path finding" are
  # self-scoping, and gating them drops the papers that say "depot" and
  # "customer" but never "logistics".
  - {id: vehicle_routing, name: Vehicle routing and path optimization, family: digital,
     include: ["vehicle routing", "travel(l)?ing salesman", "pickup and delivery problem",
               "multi[- ]agent path finding", "\\bMAPF\\b", "capacitated (vehicle )?routing"],
     exclude: [], status: active, added_week: 2026-W34, patterns_changed_week: 2026-W34}
  # Retired at lexicon v9, 2026-08-30. A method rather than a technology that
  # emerges and diffuses: 546 observations, 20% of the whole corpus, of which
  # 256 were matched by "mixed-integer linear programming" -- a solution
  # technique that appears in nearly every optimisation paper -- and 65 by
  # "computational experiments", a phrase from the methods section of one.
  #
  # It answered none of the six tracked questions. Operations research has been
  # out of the lab since the 1950s, it had no deployment signal and no adoption
  # signal, and 96% of its evidence was research. 31% of its documents were
  # already counted under a technology that does move -- 87 under vehicle
  # routing, 43 under last-mile delivery.
  #
  # Consistent with the three entries rejected in STATUS section 8 as fields
  # rather than technologies, one of which was machine learning for operations.
  # Keeping this one while rejecting that was the inconsistency.
  #
  # Retired rather than deleted: the patterns stay, so every past week still
  # replays under this file, and the reason stays where the next reader is.
  - {id: operations_research, name: Operations research methods, family: digital,
     include: ["operations research", "combinatorial optimi[sz]ation",
               "(mixed[- ])?integer (linear )?programming", "stochastic programming",
               "computational experiments", "decision support system(s)?"],
     exclude: ["passenger rail", "urban rail transit", "metro (train|system)",
               "train speed", "virtual coupling", "bike[- ]shar(e|ing)"],
     needs_context: true, status: retired, added_week: 2026-W34, patterns_changed_week: 2026-W35}
  - {id: last_mile_delivery, name: Last-mile delivery optimization, family: digital,
     include: ["last[- ]mile", "quick commerce", "same[- ]day (delivery|fulfil(l)?ment)"],
     exclude: ["last[- ]mile rail"], needs_context: true, status: active, added_week: 2026-W34, patterns_changed_week: 2026-W35}
  - {id: supply_chain_llm, name: Domain-specific LLMs for supply chain, family: digital,
     include: ["(supply chain|logistics|warehouse|procurement)[^.]{0,40}(fine[- ]tun|domain[- ]specific)[^.]{0,20}(llm|language model)",
               "llm[^.]{0,30}(warehouse|logistics|supply chain|procurement)",
               "supply chain (foundation|language) model(s)?"],
     exclude: [], needs_context: true, status: active, added_week: 2026-W34, patterns_changed_week: 2026-W34}

  # --- Data, identity & traceability ----------------------------------------
  - {id: item_level_rfid, name: Item-level RFID, family: traceability,
     include: ["item[- ]level rfid", "rfid tagging", "\\bRAIN RFID\\b"],
     exclude: [], needs_context: true, status: active, added_week: 2026-W33, patterns_changed_week: 2026-W33}
  - {id: digital_product_passport, name: Digital product passport, family: traceability,
     include: ["digital product passport(s)?"],
     exclude: [], status: active, added_week: 2026-W33, patterns_changed_week: 2026-W33}
  - {id: gs1_2d, name: GS1 2D barcode transition, family: traceability,
     include: ["gs1 (digital link|sunrise)", "2d barcode(s)?", "sunrise 2027"],
     exclude: [], needs_context: true, status: active, added_week: 2026-W33, patterns_changed_week: 2026-W33}
  - {id: blockchain_traceability, name: Blockchain traceability, family: traceability,
     include: ["blockchain (traceability|provenance)",
               "distributed ledger[^.]{0,20}(supply chain|provenance)",
               "blockchain[^.]{0,30}(supply chain|provenance|logistics)"],
     exclude: [], status: active, added_week: 2026-W33, patterns_changed_week: 2026-W33}
  - {id: minerals_traceability, name: Critical minerals traceability, family: traceability,
     include: ["critical mineral(s)? (traceability|supply chain)",
               "battery passport", "conflict mineral(s)? tracing"],
     exclude: [], status: active, added_week: 2026-W33, patterns_changed_week: 2026-W33}
  # Three documents in the last year. Tracked because the owner asked for it,
  # and because a zero here is itself an answer -- not because it has a signal.
  - {id: battery_free_iot, name: Battery-free and energy-harvesting IoT, family: traceability,
     include: ["battery[- ]free", "batteryless", "energy harvesting", "backscatter"],
     exclude: [], needs_context: true, status: active, added_week: 2026-W34, patterns_changed_week: 2026-W34}
  # Zero documents in the last year across all six sources. Absent from these
  # sources, not from the world: it would need trade press or patents to appear.
  - {id: smart_labels, name: Smart labels beyond RFID, family: traceability,
     include: ["smart label(s)?", "electronic shelf label(s)?", "printed electronics",
               "time[- ]temperature indicator(s)?"],
     exclude: [], needs_context: true, status: active, added_week: 2026-W34, patterns_changed_week: 2026-W34}

  # --- Physical & cold chain -------------------------------------------------
  - {id: cold_chain_iot, name: Cold chain IoT monitoring, family: physical,
     include: ["cold chain (monitoring|visibility|sensor(s)?)",
               "temperature[- ]controlled (logistics|monitoring)"],
     exclude: [], status: active, added_week: 2026-W33, patterns_changed_week: 2026-W33}
  - {id: active_cold_packaging, name: Active cold chain packaging, family: physical,
     include: ["active (thermal |cold )?packaging", "phase change (material|packaging)"],
     exclude: [], needs_context: true, status: active, added_week: 2026-W33, patterns_changed_week: 2026-W33}
  - {id: additive_spares, name: Additive manufacturing for spare parts, family: physical,
     include: ["additive manufacturing", "3d[- ]printed (spare |replacement )?part(s)?",
               "digital (parts )?inventory"],
     exclude: [], needs_context: true, status: active, added_week: 2026-W33, patterns_changed_week: 2026-W33}
  - {id: microfactories, name: Microfactories and distributed manufacturing, family: physical,
     include: ["microfactor(y|ies)", "distributed manufacturing", "on[- ]demand manufacturing"],
     exclude: [], needs_context: true, status: active, added_week: 2026-W33, patterns_changed_week: 2026-W33}
  - {id: microfulfillment, name: Microfulfillment automation, family: physical,
     include: ["micro[- ]fulfil(l)?ment", "dark store(s)?", "automated fulfil(l)?ment cent(er|re)"],
     exclude: [], status: active, added_week: 2026-W33, patterns_changed_week: 2026-W33}
  # Matched nothing in a year: the old patterns demanded damage/cargo wording
  # that real papers do not use. Broadened by proximity rather than by gating
  # alone -- a bare "computer vision" is 38 gated hits at under half precision,
  # because the gate admits smart fridges and biomedical imaging.
  - {id: cv_inspection, name: Computer vision for logistics and inspection, family: physical,
     include: ["(damage|cargo|container) (detection|inspection)[^.]{0,20}(vision|ai)",
               "automated (damage|defect) inspection",
               "(computer|machine) vision[^.]{0,80}(warehouse|logistics|pallet(s)?|container(s)?|cargo|freight|inventory|shipment(s)?|supply chain|parcel(s)?|order picking|production line)",
               "(warehouse|logistics|pallet(s)?|container(s)?|cargo|freight|inventory|shipment(s)?|supply chain|parcel(s)?|order picking|production line)[^.]{0,80}(computer|machine) vision",
               "(defect|damage) detection[^.]{0,70}(warehouse|logistics|pallet(s)?|container(s)?|cargo|freight|inventory|shipment(s)?|supply chain|parcel(s)?|order picking|production line|manufacturing)"],
     exclude: [], needs_context: true, status: active, added_week: 2026-W33, patterns_changed_week: 2026-W34}

  # --- Networks & resilience -------------------------------------------------
  - {id: risk_intelligence, name: Supply chain risk intelligence, family: networks,
     include: ["risk (intelligence|monitoring) platform(s)?", "risk intelligence",
               "\\bn[- ]tier (visibility|mapping)", "supplier risk platform(s)?"],
     exclude: [], needs_context: true, status: active, added_week: 2026-W33, patterns_changed_week: 2026-W35}
  # Retired 2026-W36. 0 of 4 correct in the 2026-09-02 audit: bare
  # "nearshoring" and "reshoring" are topic words that appear in trade-policy
  # stories, factory-automation features and robotics grant abstracts, none of
  # which is an analytics tool. The name promised analytics and the patterns
  # asked only for the subject. Retired rather than deleted so past weeks still
  # replay and the reason stays where the next reader is.
  - {id: nearshoring_analytics, name: Nearshoring and network redesign, family: networks,
     include: ["nearshoring", "reshoring", "friend[- ]shoring",
               "network (re)?design optimi[sz]ation"],
     exclude: [], needs_context: true, status: retired, added_week: 2026-W33, patterns_changed_week: 2026-W36}
  - {id: rail_intermodal_tech, name: Rail intermodal technology, family: networks,
     include: ["intermodal (terminal|technology|automation)",
               "automated (rail )?inspection portal(s)?"],
     exclude: [], status: active, added_week: 2026-W33, patterns_changed_week: 2026-W35}
  # Split out of rail_intermodal_tech at lexicon v8. PTC is train control, not
  # intermodal technology: eleven of twelve sampled Federal Register rows for
  # that technology were FRA notices of PTC amendments, mostly for passenger
  # railroads, so it was measuring the FRA's paperwork cadence. It is a real
  # rail technology and keeps its own entry rather than being deleted.
  - {id: positive_train_control, name: Positive train control, family: networks,
     include: ["positive train control", "\\bPTC\\b system(s)?",
               "interoperable (electronic )?train (management|control)"],
     exclude: [], status: active, added_week: 2026-W35, patterns_changed_week: 2026-W35}
  - {id: inland_ports, name: Inland ports, family: networks,
     include: ["inland port(s)?", "dry port(s)?", "inland (container )?terminal(s)?"],
     exclude: [], status: active, added_week: 2026-W33, patterns_changed_week: 2026-W33}
  - {id: private_5g_warehouse, name: Private wireless and indoor positioning, family: networks,
     include: ["private (5g|6g|lte) network(s)?", "private cellular[^.]{0,20}(warehouse|factory)",
               "\\b6G\\b[^.]{0,70}(warehouse|logistics|pallet(s)?|container(s)?|cargo|freight|inventory|shipment(s)?|supply chain|parcel(s)?|order picking|production line|factor(y|ies)|industrial)",
               "\\bUWB\\b", "ultra[- ]wideband", "LoRaWAN"],
     exclude: [], needs_context: true, status: active, added_week: 2026-W33, patterns_changed_week: 2026-W34}
  - {id: quantum_logistics, name: Quantum optimization for logistics, family: networks,
     include: ["quantum (annealing|optimi[sz]ation)[^.]{0,30}(logistics|routing|supply chain)",
               "quantum[- ]inspired optimi[sz]ation"],
     exclude: [], needs_context: true, status: active, added_week: 2026-W33, patterns_changed_week: 2026-W33}
  # Kept, not retired, and the audit is why: 51 of its 121 observations come
  # from Scopus, where the journal container already guarantees the domain, and
  # those read correctly -- "Green logistics service sharing", "Decarbonisation
  # and firm financial performance". What scored 1 of 6 were the bare phrases
  # elsewhere: "greenhouse gas emissions" is a *reported metric* on a federal
  # freight award and generic framing in energy papers. The bare terms now need
  # a freight word within eighty characters; "green logistics" stands alone.
  # Eighty and not forty: forty dropped "Decarbonisation and firm financial
  # performance: The roles of supply chain transparency", where the two halves
  # sit fifty-five characters apart. Tuned against the coded items, not guessed.
  # The re-audit added "transport" and "logistical" to the freight vocabulary:
  # "emissions reporting across transport chains undermine system-level
  # decarbonization" was being dropped for want of the word.
  - {id: green_logistics, name: Freight decarbonization, family: networks,
     include: ["green logistics",
               "(freight|logistic(s|al)|shipping|maritime|port|truck(ing)?|rail|vessel|transport(ation)?|supply chain)[^.]{0,80}(decarboni[sz](e|ed|ing|ation)|greenhouse gas emission(s)?|carbon footprint|emission(s)? reduction)",
               "(decarboni[sz](e|ed|ing|ation)|greenhouse gas emission(s)?|carbon footprint)[^.]{0,80}(freight|logistic(s|al)|shipping|maritime|port|truck(ing)?|rail|vessel|transport(ation)?|supply chain)"],
     exclude: [], needs_context: true, status: active, added_week: 2026-W34, patterns_changed_week: 2026-W36}
  # Retired 2026-W36. 0 of 4 correct in the 2026-09-02 audit: "critical
  # infrastructure" is background phrasing in secure-coding education grants,
  # bridge-inspection research and drone roadmaps, and 15 of its 28
  # observations came from arXiv on that phrase alone. It is also software
  # supply chain security -- rejected in 6bf0700 as a field rather than a
  # technology -- arriving through the pattern list instead of the front door.
  - {id: infrastructure_security, name: Critical infrastructure and OT security, family: networks,
     include: ["critical infrastructure", "operational technology security",
               "\\bICS\\b security", "\\bSCADA\\b"],
     exclude: ["catenary", "wharf", "pole foundation", "breakwater", "dredg"],
     needs_context: true, status: retired, added_week: 2026-W34, patterns_changed_week: 2026-W36}
