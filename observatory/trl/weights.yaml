version: 1
# A claim's weight =
#   actor[actor_type] * source[source_type] * setting[setting] * recency(doc_date)
# recency = 0.5 ** (days_old / half_life_days). Unverified quotes weigh 0.
# Cumulative support at level L = the sum of the weights of the claims whose
# band (schema.BAND) reaches L or higher, EACH CLAIM COUNTED ONCE however many
# levels its band spans (a "sells" claim, band 7-8, adds its weight once).
# The point estimate is the HIGHEST level whose cumulative support reaches
# support_threshold. Averaging is deliberately absent. When no level reaches
# it there is no point: the page says "insufficient evidence" and shows the
# span of levels the claims evidence.
half_life_days: 365
# One recent, verified, multi-site claim from a user firm in a press release
# is enough to hold a level; one startup press release is not. Hand-checked
# against the weights below: a fresh user-firm/press_release/multiple_sites
# claim weighs 1.0*0.6*0.9=0.54; a fresh startup/press_release/one_site claim
# weighs 0.4*0.6*0.7=0.168. 0.5 sits between them.
support_threshold: 0.5
# An "abandons" claim always dents levels 7, 8 and 9, whatever its own setting
# or whichever level it was about: contrary_penalty * its weight is subtracted
# from the support at each of 7, 8 and 9 and from the cumulative support at
# 7, 8 and 9, so a retreat shows as lowered support, not as silence.
contrary_penalty: 1.0
actor:
  user_firm: 1.0        # the party that would bear the cost of being wrong
  government: 0.9
  incumbent_vendor: 0.6
  startup: 0.4          # announcing is the business model
  analyst: 0.5
  university: 0.3
  unclear: 0.2
source:
  filing: 1.0           # attested under liability
  government_record: 1.0
  press_release: 0.6
  trade_article: 0.7
  paper: 0.5
  patent: 0.4
  funding_record: 0.6
  analyst_note: 0.6
  code_repository: 0.3
  job_posting: 0.5
  forum_post: 0.2
setting:
  network_wide: 1.0
  multiple_sites: 0.9
  one_site: 0.7
  test_site: 0.5
  lab: 0.3
  unclear: 0.4
